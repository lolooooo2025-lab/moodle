{% extends "base.html" %}
{% block content %}
<div class="auth-card card">
  <h1>{{ t('auth.forgot') }}</h1>
  <form id="forgot-form" data-api="/api/auth/forgot" novalidate>
    <div class="field">
      <label for="phone">{{ t('auth.phone') }}</label>
      <input id="phone" name="phone" type="tel" inputmode="numeric" required dir="ltr">
    </div>
    <div class="form-error" role="alert" hidden></div>
    <button type="submit" class="btn btn-primary btn-block">{{ t('auth.reset_btn') }}</button>
  </form>
  <div class="auth-links"><a href="/login">{{ t('nav.back') }}</a></div>
</div>
{% endblock %}
