{% extends "base.html" %}
{% block content %}
<div class="page-head"><h1>{{ t('nav.notifications') }}</h1><div class="row"><button class="btn btn-ghost btn-sm" id="push-enable">{{ t('notif.push_enable') }}</button><button class="btn btn-primary btn-sm" id="mark-all">{{ t('notif.mark_all_read') }}</button></div></div>
<p class="muted"><a href="/campaigns">{{ t('notif.friday_archive') }}</a></p>
<div id="notification-list" class="stack"></div>
<div id="notifications-empty" class="empty-state card" hidden><h2>{{ t('notif.empty') }}</h2><p class="muted">{{ t('notif.empty_desc') }}</p></div>
{% endblock %}
{% block scripts %}<script src="/static/js/notifications.js" defer></script>{% endblock %}
